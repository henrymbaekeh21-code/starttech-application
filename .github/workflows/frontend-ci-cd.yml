# ============================================================================
# Frontend CI/CD Pipeline
# ============================================================================
# Builds the React app, runs tests and security scans,
# deploys to S3, and invalidates the CloudFront cache.
# ============================================================================

name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  pull_request:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "20"

permissions:
  contents: read
  id-token: write

jobs:
  # -------------------------------------------------------------------------
  # Build & Test
  # -------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm run test --if-present -- --coverage --watchAll=false

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Build production bundle
        run: npm run build
        env:
          CI: true
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Deploy to S3
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to S3
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/

      - name: Sync to S3
        run: |
          aws s3 sync build/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "service-worker.js"

          aws s3 cp build/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text

      - name: Notify deployment
        run: |
          echo "Frontend deployed to https://${{ secrets.CLOUDFRONT_DOMAIN }}"
